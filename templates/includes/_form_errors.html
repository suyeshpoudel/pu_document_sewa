{% if form.non_field_errors %}
  <div class="alert alert-error" role="alert">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
    <div>{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
  </div>
{% endif %}
