{% extends "base.html" %}

{% block nav %}
<div class="flex items-center gap-6">
  <a href="{% url 'office_home' %}" class="text-lg font-bold text-blue-700">Admin — PU Document Sewa</a>
  <span class="text-xs font-semibold uppercase tracking-wide rounded-full bg-blue-50 text-blue-700 px-2.5 py-1">Admin</span>
</div>
<div class="flex items-center gap-3">
  <a href="{% url 'home' %}" class="text-sm text-gray-600 hover:text-blue-600">Main site</a>
  {% if user.is_authenticated %}
    <a href="{% url 'profile' %}" class="text-sm text-gray-600 hover:text-blue-600">{{ user.email }}</a>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="text-sm rounded-lg border border-gray-300 px-3 py-1.5 hover:bg-gray-100">Logout</button>
    </form>
  {% endif %}
</div>
{% endblock %}
