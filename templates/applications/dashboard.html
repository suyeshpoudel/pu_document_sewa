{% extends "base.html" %}

{% block title %}Admin Dashboard — PU Document Sewa{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Application Dashboard</h1>

<div class="mb-4 flex flex-wrap gap-2">
  <a href="{% url 'admin_dashboard' %}" class="rounded-full px-3 py-1 text-sm border {% if not current_status %}bg-blue-600 text-white border-blue-600{% else %}border-gray-300 text-gray-600 hover:bg-gray-100{% endif %}">All</a>
  {% for value, label in statuses %}
    <a href="?status={{ value }}" class="rounded-full px-3 py-1 text-sm border {% if current_status == value %}bg-blue-600 text-white border-blue-600{% else %}border-gray-300 text-gray-600 hover:bg-gray-100{% endif %}">{{ label }}</a>
  {% endfor %}
</div>

{% include "applications/_table.html" %}
{% endblock %}
